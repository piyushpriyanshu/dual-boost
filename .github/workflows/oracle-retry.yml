name: Oracle server auto-retry

# Creates the DualBoost bond server from the saved Oracle stack. Each run retries every 3 minutes for
# about 5.5 hours, then starts the next run, so it keeps trying around the clock until Oracle has free
# capacity (GitHub runs timed jobs only every few hours on small repositories; the schedule below just
# restarts the chain if it ever stops). Disables itself once the server exists. Logs show no private data.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/oracle

      - name: Install the Oracle SDK
        run: pip install --quiet oci

      - name: Ask Oracle for the server
        id: try
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          LOOP_MINUTES: '330'
          EVERY_SECONDS: '180'
        run: |
          set +e
          python3 .github/oracle/apply_stack.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 1 ] && exit 1
          exit 0

      - name: Still waiting - start the next run
        if: steps.try.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run oracle-retry.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"

      - name: Done - tell the owner and stop retrying
        if: steps.try.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="@$GITHUB_REPOSITORY_OWNER Oracle created your DualBoost bond server. Open Oracle Cloud -> Compute -> Instances -> DualBoost, copy its Public IP address, then in DualBoost: Settings -> Bond server -> paste -> Save (guide step 31). This automatic retry has now switched itself off."
          TITLE="Your DualBoost server is ready"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --assignee "$GITHUB_REPOSITORY_OWNER" --body "$BODY" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
          gh workflow disable oracle-retry.yml --repo "$GITHUB_REPOSITORY"
