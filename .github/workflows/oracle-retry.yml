name: Oracle server auto-retry

# Creates the DualBoost bond server from the saved Oracle stack, retrying every ~5 minutes until
# Oracle has free capacity. Disables itself once the server exists. Logs show no private data.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/oracle

      - name: Install the Oracle SDK
        run: pip install --quiet oci

      - name: Ask Oracle for the server
        id: try
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set +e
          python3 .github/oracle/apply_stack.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 1 ] && exit 1
          exit 0

      - name: Done - tell the owner and stop retrying
        if: steps.try.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Your DualBoost server is ready" \
            --body "Oracle created your DualBoost bond server. Open Oracle Cloud -> Compute -> Instances -> DualBoost, copy its Public IP address, then in DualBoost: Settings -> Bond server -> paste -> Save (guide step 31). This automatic retry has now switched itself off." || true
          gh workflow disable oracle-retry.yml --repo "$GITHUB_REPOSITORY"
