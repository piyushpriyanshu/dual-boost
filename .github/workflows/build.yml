name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (with tunnel engine submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version from commit count (only releases on main advance it)
        run: |
          # +2 keeps numbering above the earlier run-number based releases (last was 1.0.8).
          CODE=$(( $(git rev-list --count HEAD) + 2 ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$CODE" >> "$GITHUB_ENV"
          echo "Building version 1.0.$CODE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" > /dev/null

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libhev-socks5-tunnel.so" || (echo "native engine missing" && exit 1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -1
          cp "$APK" "DualBoost-v${VERSION_NAME}.apk"
          sha256sum "DualBoost-v${VERSION_NAME}.apk" > "DualBoost-v${VERSION_NAME}.apk.sha256"
          cat "DualBoost-v${VERSION_NAME}.apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualBoost-v${{ env.VERSION_NAME }}
          path: DualBoost-v${{ env.VERSION_NAME }}.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHATS_NEW="$(git log -1 --pretty=%s)"
          {
            echo "What's new: ${WHATS_NEW}"
            echo
            echo "DualBoost updates itself from this page. For a first install, download **DualBoost-v${VERSION_NAME}.apk** below on your phone and open it."
            echo
            echo "Built from commit ${GITHUB_SHA::7}."
          } > notes.md
          gh release create "v${VERSION_NAME}" \
            "DualBoost-v${VERSION_NAME}.apk" \
            "DualBoost-v${VERSION_NAME}.apk.sha256" \
            --title "DualBoost ${VERSION_NAME}" \
            --latest \
            --notes-file notes.md

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          {
            echo "Build #${{ github.run_number }} failed on commit ${GITHUB_SHA::7}."
            echo
            echo '### Errors'
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED|Could not|> " build.log | head -120 || true
            echo '```'
            echo
            echo '### Log tail'
            echo '```'
            tail -n 150 build.log
            echo '```'
          } > report.md
          gh issue create --title "Build #${{ github.run_number }} failed" --body-file report.md
